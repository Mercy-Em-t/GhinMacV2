<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Craft Atelier - Autonomous Operations</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
</head>
<body class="bg-gray-50 text-gray-800 font-sans p-8">
    <div id="app" class="max-w-4xl mx-auto">
        <header class="mb-8 p-6 bg-white rounded-xl shadow-sm border border-gray-200">
            <h1 class="text-3xl font-extrabold text-transparent bg-clip-text bg-gradient-to-r from-green-600 to-teal-600">
                Craft Atelier HQ
            </h1>
            <p class="text-gray-500 mt-1">Autonomous M-Pesa Reconciliation & Dispatch</p>
        </header>

        <div class="grid grid-cols-1 md:grid-cols-2 gap-8">
            <div class="bg-white p-6 rounded-xl shadow-sm border border-gray-200">
                <h2 class="text-xl font-bold mb-4">Simulate Webhooks</h2>
                <button @click="triggerMpesaWebhook" class="w-full mb-3 px-4 py-3 bg-green-600 text-white rounded-lg hover:bg-green-700 shadow-sm">
                    1. Simulate Supabase M-Pesa Hook
                </button>
                <button @click="triggerDispatch" class="w-full px-4 py-3 bg-blue-600 text-white rounded-lg hover:bg-blue-700 shadow-sm">
                    2. Trigger Dispatch AI
                </button>
            </div>

            <div class="bg-white p-6 rounded-xl shadow-sm border border-gray-200">
                <h2 class="text-xl font-bold mb-4">Task Log</h2>
                <div class="h-48 overflow-y-auto bg-gray-100 p-4 rounded-lg">
                    <ul class="text-sm space-y-2">
                        <li v-for="(log, idx) in logs" :key="idx" class="text-gray-700">
                            <span class="text-gray-400 text-xs mr-2">{{ log.time }}</span>
                            {{ log.message }}
                        </li>
                    </ul>
                </div>
            </div>
        </div>
    </div>

    <script>
        const { createApp, ref, onMounted } = Vue;

        createApp({
            setup() {
                const logs = ref([]);
                const addLog = (msg) => {
                    logs.value.unshift({ time: new Date().toLocaleTimeString(), message: msg });
                };

                const triggerMpesaWebhook = async () => {
                    addLog('Supabase Webhook Received: M-Pesa Payment');
                    await fetch('/tasks', {
                        method: 'POST', 
                        headers: {'Content-Type': 'application/json'}, 
                        body: JSON.stringify({department: 'finance', payload: {action: 'reconcile', order_id: '101', amount: 500}})
                    });
                };

                const triggerDispatch = async () => {
                    addLog('Sending to Dispatch AI...');
                    await fetch('/tasks', {
                        method: 'POST', 
                        headers: {'Content-Type': 'application/json'}, 
                        body: JSON.stringify({department: 'dispatch', payload: {action: 'mark_in_transit', order_id: '101'}})
                    });
                };

                onMounted(() => {
                    const protocol = window.location.protocol === 'https:' ? 'wss:' : 'ws:';
                    const ws = new WebSocket(`${protocol}//${window.location.host}/ws/events`);
                    ws.onmessage = (event) => {
                        const data = JSON.parse(event.data);
                        if(data.event === "task_completed" || data.event === "tool_call") {
                            addLog(`AI Action: ${JSON.stringify(data.payload)}`);
                        }
                    };
                });

                return { logs, triggerMpesaWebhook, triggerDispatch };
            }
        }).mount('#app');
    </script>
</body>
</html>
